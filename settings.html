<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Michael AI Settings</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="profile">

    <div class="avatar">⚙️</div>

    <h1>تنظیمات Michael AI</h1>

    <p>شخصی‌سازی دستیار شما</p>

  </div>


  <div class="chat-box">

    <div class="michael-message">

      👤 نام شما:

      <br><br>

      <input id="username" placeholder="نام خود را وارد کنید">

    </div>


    <div class="michael-message">

      🗑️ پاک کردن تاریخچه گفتگو

      <br><br>

      <button onclick="clearChat()">
        پاک کردن چت
      </button>

    </div>

  </div>


  <button onclick="saveSettings()">
    💾 ذخیره تنظیمات
  </button>


  <button onclick="goHome()">
    🏠 بازگشت
  </button>


</div>


<script>

function saveSettings() {

  let name = document.getElementById("username").value;

  localStorage.setItem("michaelUser", name);

  alert("تنظیمات ذخیره شد ✅");

}


function clearChat() {

  localStorage.removeItem("michaelChat");

  alert("تاریخچه چت پاک شد");

}


function goHome() {

  window.location.href = "index.html";

}


</script>


</body>
</html>
